name: Copy app.html to main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Copy app.html from feature branch
        run: |
          git fetch origin claude/staff-newspaper-feature-is7606
          git checkout origin/claude/staff-newspaper-feature-is7606 -- app.html
          echo "Copied app.html from feature branch"
          wc -l app.html

      - name: Commit and push to main
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add app.html
          git diff --cached --stat
          git commit -m "feat: Sales leaderboard, Eva, Aleksey Shch, manager schedule editing"
          git push origin main
